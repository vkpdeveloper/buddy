<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding: Core Metrics</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "lime-accent": "#CCFF00", // Electric Lime
                        "lime-dim": "#AACC00",
                        "dark-bg": "#0A0A0A",     // Almost black
                        "dark-card": "#141414",   // Very dark grey
                        "dark-border": "#262626", // Subtle border
                        "text-main": "#FFFFFF",
                        "text-muted": "#666666"
                    },
                    fontFamily: {
                        "sans": ["Plus Jakarta Sans", "sans-serif"],
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-dark-bg font-sans text-text-main antialiased overflow-x-hidden;
                min-height: 100dvh;
            }
            input[type="text"], input[type="number"], input[type="date"] {
                @apply bg-transparent border-none text-text-main focus:ring-0 p-0 text-lg font-medium w-full placeholder-text-muted;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="dark flex flex-col h-full min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-dark-bg border-x border-dark-border shadow-2xl p-6">
<header class="pt-6 pb-8 flex items-center justify-between">
<button class="text-text-muted hover:text-white transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex gap-1.5">
<div class="h-1 w-8 rounded-full bg-lime-accent"></div>
<div class="h-1 w-8 rounded-full bg-lime-accent"></div>
<div class="h-1 w-8 rounded-full bg-dark-border"></div>
<div class="h-1 w-8 rounded-full bg-dark-border"></div>
</div>
<div class="w-6"></div> 
</header>
<main class="flex-1 flex flex-col">
<div class="mb-8">
<h1 class="text-3xl font-bold uppercase tracking-tight mb-2">Core Metrics</h1>
<p class="text-text-muted text-sm leading-relaxed">
                We've synced your baseline data from Health Connect. Verify your core metrics to calibrate your initial workout plan.
            </p>
</div>
<div class="space-y-4">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-lime-accent text-lg">health_and_safety</span>
<span class="text-xs font-bold tracking-widest uppercase text-lime-accent">Health Connect Synced</span>
</div>
<div class="group relative bg-dark-card border border-dark-border rounded-lg p-5 transition-all focus-within:border-lime-accent/50 hover:border-dark-border/80">
<div class="flex justify-between items-start mb-2">
<label class="text-[10px] font-bold tracking-[0.2em] uppercase text-text-muted">Height</label>
<span class="material-symbols-outlined text-lime-accent text-sm" title="Auto-filled">check_circle</span>
</div>
<div class="flex items-baseline gap-1">
<input class="text-3xl font-semibold bg-transparent border-none p-0 w-20 focus:ring-0 text-white" type="number" value="182"/>
<span class="text-text-muted text-sm font-medium">CM</span>
</div>
</div>
<div class="group relative bg-dark-card border border-dark-border rounded-lg p-5 transition-all focus-within:border-lime-accent/50 hover:border-dark-border/80">
<div class="flex justify-between items-start mb-2">
<label class="text-[10px] font-bold tracking-[0.2em] uppercase text-text-muted">Weight</label>
<span class="material-symbols-outlined text-lime-accent text-sm" title="Auto-filled">check_circle</span>
</div>
<div class="flex items-baseline gap-1">
<input class="text-3xl font-semibold bg-transparent border-none p-0 w-24 focus:ring-0 text-white" type="number" value="78.5"/>
<span class="text-text-muted text-sm font-medium">KG</span>
</div>
</div>
<div class="group relative bg-dark-card border border-dark-border rounded-lg p-5 transition-all focus-within:border-lime-accent/50 hover:border-dark-border/80">
<div class="flex justify-between items-start mb-2">
<label class="text-[10px] font-bold tracking-[0.2em] uppercase text-text-muted">Birth Date</label>
<span class="material-symbols-outlined text-lime-accent text-sm" title="Auto-filled">check_circle</span>
</div>
<div class="flex items-center">
<input class="text-xl font-semibold bg-transparent border-none p-0 w-full focus:ring-0 text-white uppercase tracking-wide" type="text" value="MAR 12, 1996"/>
<span class="material-symbols-outlined text-text-muted">calendar_today</span>
</div>
</div>
<div class="pt-2">
<label class="text-[10px] font-bold tracking-[0.2em] uppercase text-text-muted mb-3 block">Biological Sex</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-4 rounded-lg border border-lime-accent bg-lime-accent/10 text-white transition-all">
<span class="text-xs font-bold tracking-widest uppercase">Male</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 rounded-lg border border-dark-border bg-dark-card text-text-muted hover:text-white hover:border-white/20 transition-all">
<span class="text-xs font-bold tracking-widest uppercase">Female</span>
</button>
</div>
</div>
</div>
</main>
<footer class="mt-auto pt-6 pb-2">
<button class="w-full bg-lime-accent text-black font-bold text-sm tracking-widest uppercase py-4 rounded-lg hover:bg-lime-dim transition-colors shadow-[0_0_20px_rgba(204,255,0,0.15)] flex items-center justify-center gap-2">
            Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<div class="text-center mt-4">
<button class="text-[10px] font-bold tracking-widest uppercase text-text-muted hover:text-white transition-colors">
                Skip for now
            </button>
</div>
</footer>
</div>

</body></html>
