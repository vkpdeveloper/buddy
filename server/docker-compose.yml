services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    command: ["bun", "run", "src/index.ts"]

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["bun", "run", "src/worker.ts"]
    restart: unless-stopped
    depends_on:
      - api
